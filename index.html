<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
    <h1>Reading Flow</h1>
    <input type="text" id="searchBar" class="search-bar" placeholder="Search books...">
</header>
        <!-- Year Tabs -->
        <div class="year-tabs" id="yearTabs"></div>

        <!-- Stats Section -->
        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="booksCount">0</div>
                <div class="stat-label">Books</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pagesCount">0</div>
                <div class="stat-label">Pages</div>
            </div>
        </div>

        <!-- Bookshelf -->
        <div class="bookshelf" id="bookshelf"></div>
    </div>

    <!-- Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content">
            <button class="close-button" id="closeButton">×</button>
            <div class="popup-body">
    <div class="popup-cover-container">
        <img id="popupCover" class="popup-cover" src="" alt="">
    </div>
    <div class="popup-details">
        <h2 class="popup-title" id="popupTitle"></h2>
        <p class="popup-author" id="popupAuthor"></p>
        <div class="popup-rating" id="popupRating"></div>
        <p class="popup-pages" id="popupPages"></p>
        <p class="popup-blurb" id="popupBlurb"></p>
        <button class="share-button" id="shareButton" title="Share this book">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
