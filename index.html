<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Flow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reading Flow</h1>
        </header>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="booksCount">0</div>
                <div class="stat-label">Books Read This Year</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pagesCount">0</div>
                <div class="stat-label">Pages Read This Year</div>
            </div>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="books-grid" id="booksGrid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
