<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reading Flow</h1>
        </header>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="booksCount">0</div>
                <div class="stat-label">Books</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pagesCount">0</div>
                <div class="stat-label">Pages Read</div>
            </div>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="bookshelf" id="bookshelf"></div>

        <!-- Book Detail Popup -->
        <div class="popup-overlay" id="popupOverlay">
            <div class="popup-content">
                <button class="close-button" id="closeButton">×</button>
                <div class="popup-body">
                    <div class="popup-cover-container">
                        <img id="popupCover" class="popup-cover" src="" alt="">
                    </div>
                    <div class="popup-details">
                        <h2 id="popupTitle" class="popup-title"></h2>
                        <div id="popupAuthor" class="popup-author"></div>
                        <div id="popupRating" class="popup-rating"></div>
                        <div id="popupPages" class="popup-pages"></div>
                        <div id="popupBlurb" class="popup-blurb"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
