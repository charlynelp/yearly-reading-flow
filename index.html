<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Funnel+Display:wght@300..800&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reading Flow</h1>
        </header>

        <div class="current-year" id="currentYearDisplay">2025</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="booksCount">0</div>
                <div class="stat-label">Books Read This Year</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pagesCount">0</div>
                <div class="stat-label">Pages Read This Year</div>
            </div>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="books-grid" id="booksGrid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
